---
layout: default
---
<article class="page">
  <header class="page-header">
    <time class="eyebrow" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    <h1 class="page-title">{{ page.title | escape_once }}</h1>
    {%- if page.description %}
    <p class="page-lead">{{ page.description | escape_once }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
