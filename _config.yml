# -----------------------------------------------------------------------------
# Site
# -----------------------------------------------------------------------------

title: Shubham Kaushik
author: Shubham Kaushik
email: shubhamk00020@gmail.com
description: >-
  PhD researcher at Brandeis University exploring LSM-tree optimizations and data systems.
keywords: LSM trees, data systems, distributed systems, PhD, Brandeis University
lang: en
url: https://shubhamkaushik.com
baseurl: ""

# Social profiles (leave blank to hide)
orcid_id: 0009-0002-7336-2312
scholar_userid: TLBud9MAAAAJ
github_username: shukham
linkedin_username: shukham
x_username: shubhamsudo

# Shown in the navigation once at least one post exists
blog_nav_title: Blog
permalink: /blog/:year/:title/

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/
  talks:
    output: false

defaults:
  - scope:
      path: ""
      type: news
    values:
      layout: post
      sitemap: false
  - scope:
      path: "assets"
    values:
      sitemap: false

# -----------------------------------------------------------------------------
# Build
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

sass:
  style: compressed
  sourcemap: never

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll/scholar

include: [_pages]
exclude:
  - bin
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - node_modules
  - "*.code-workspace"
  - assets/pdf/sections
  - assets/pdf/*.tex
  - assets/pdf/*.aux
  - assets/pdf/*.fdb_latexmk
  - assets/pdf/*.fls
  - assets/pdf/*.log
  - assets/pdf/*.out
  - assets/pdf/*.synctex.gz
  - assets/pdf/*.docx

# -----------------------------------------------------------------------------
# Publications (jekyll-scholar)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Kaushik]
  first_name: [Shubham]
  style: apa
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
