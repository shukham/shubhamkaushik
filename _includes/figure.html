{%- assign alt = include.alt | default: include.title | default: include.caption | default: "" -%}
{%- assign size = include.path | image_size -%}
<figure>
  <img src="{{ include.path | relative_url }}" alt="{{ alt | strip_html | escape }}"
    {%- if include.class %} class="{{ include.class }}"{% endif %}
    {%- if include.title %} title="{{ include.title | escape }}"{% endif %}
    {%- if size %} width="{{ size[0] }}" height="{{ size[1] }}"{% endif %} loading="lazy" decoding="async">
  {%- if include.caption %}
  <figcaption>{{ include.caption }}</figcaption>
  {%- endif %}
</figure>
